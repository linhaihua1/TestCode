# JMeter Save Service 配置
# 控制 .jtl / .csv 结果文件中各字段的写入行为
# 完整默认参考 https://github.com/apache/jmeter/blob/v5.6.3/bin/saveservice.properties

# 输出格式：csv | xml | db
formatter=csv

# 字段开关（与 jmeter.properties 一致；此处为运行时硬编码默认值）
time=true
label=true
response_code=true
response_message=true
data_type=true
success=true
thread_name=true
bytes=true
sent_bytes=true
connect_time=true
latency=true
url=true
file_name=false
timestamp_format=ms
encoding=true
assertions=true
assertion_results_failure_message=true
print_field_names=true
subresults=true
samplerData=false
responseHeaders=false
requestHeaders=false
hostname=false
thread_counts=false
sampleCount=false
idleTime=false
