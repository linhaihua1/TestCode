# Apache JMeter 5.6 嵌入式执行所需的最小配置
# 完整默认配置可参考 https://github.com/apache/jmeter/blob/v5.6.3/bin/jmeter.properties
# 此处只覆盖执行必需的属性，其它使用 JMeter 内部默认值

# ============================================================
# 日志级别
# ============================================================
log_level.jmeter=WARN
log_level.jmeter.junit=DEBUG

# ============================================================
# Save Service：结果文件格式
# ============================================================
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.print_field_names=true
jmeter.save.saveservice.autoflush=true
jmeter.save.saveservice.assertion_results_failure_message=true
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.data_type=true
jmeter.save.saveservice.label=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.response_code=true
jmeter.save.saveservice.response_message=true
jmeter.save.saveservice.successful=true
jmeter.save.saveservice.thread_name=true
jmeter.save.saveservice.time=true
jmeter.save.saveservice.timestamp_format=ms
jmeter.save.saveservice.sent_bytes=true
jmeter.save.saveservice.url=true

# ============================================================
# HTTPS / SSL
# ============================================================
jmeter.ssl.provider=SunJSSE
https.use.cached.ssl.context=true

# ============================================================
# Cookie Manager
# ============================================================
CookieManager.check.cookies=false
CookieManager.save.cookies=false

# ============================================================
# HTTP 请求默认值
# ============================================================
httpclient4.retrycount=0
httpclient4.idletimeout=60000
httpclient4.connect_timeout=30000
httpclient4.response_timeout=120000

# ============================================================
# 结果集字段
# ============================================================
sampleresult.default.encoding=UTF-8

# ============================================================
# 线程组默认行为
# ============================================================
jmeter.thread.stop=false
jmeterengine.startlistenerslater=false
jmeterengine.force.system.exit=false

# ============================================================
# 远程模式（嵌入式不使用，但保留默认值避免启动报错）
# ============================================================
remote_hosts=127.0.0.1
