server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: api-web-server
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:api_web}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&connectionCollation=utf8mb4_unicode_ci
    username: ${MYSQL_USER:apiweb}
    password: ${MYSQL_PASSWORD:apiweb123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:apiweb}
    password: ${RABBITMQ_PASSWORD:apiweb123}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org.quartz.scheduler.instanceName: api-web-scheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 10000
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.threadPool.threadCount: 10
  flyway:
    # 已存在非空库时自动 baseline（记录当前为 V1），不重复执行 V1，避免覆盖老数据
    baseline-on-migrate: true
    baseline-version: 1
    # 迁移脚本位置
    locations: classpath:db/migration
    # 禁止在迁移时清理数据库（防止误删生产数据）
    clean-disabled: true
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: UTC
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_uuid
    banner: false
  configuration:
    map-underscore-to-camel-case: true

# MinIO（超 1MB 的调试记录/报告请求体、响应体存这里，数据库只存引用路径）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:apiweb}
  secret-key: ${MINIO_SECRET_KEY:apiweb123}
  bucket: ${MINIO_BUCKET:api-web}

apiweb:
  jwt:
    # 签名密钥（HS256，≥32 字节）。未配置时启动自动生成随机密钥并告警；
    # localdev profile 已提供固定的开发用密钥；生产务必通过 JWT_SECRET 注入。
    secret: ${JWT_SECRET:}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  mq:
    # 是否启用 RabbitMQ 消费端（@RabbitListener）。localdev 单机调试时关闭，
    # 此时 UI/性能任务改用 @Async 本地异步执行。
    enabled: ${MQ_ENABLED:true}
    # 任务交换机（topic）；名称可通过环境变量覆盖，代码中不硬编码
    exchange: ${MQ_TASK_EXCHANGE:apiweb.task.exchange}
    # 执行结果回传交换机（fanout）
    result-exchange: ${MQ_RESULT_EXCHANGE:apiweb.result.exchange}
    # 三类任务队列名
    queue:
      api: ${MQ_API_QUEUE:apiweb.task.api.queue}
      ui: ${MQ_UI_QUEUE:apiweb.task.ui.queue}
      perf: ${MQ_PERF_QUEUE:apiweb.task.perf.queue}
    # 生产者投递路由键
    routing-key:
      api: ${MQ_API_ROUTING_KEY:task.api.execute}
      ui: ${MQ_UI_ROUTING_KEY:task.ui.execute}
      perf: ${MQ_PERF_ROUTING_KEY:task.perf.execute}
    # 队列绑定到交换机的通配路由键
    binding-key:
      api: ${MQ_API_BINDING_KEY:task.api.#}
      ui: ${MQ_UI_BINDING_KEY:task.ui.#}
      perf: ${MQ_PERF_BINDING_KEY:task.perf.#}
  security:
    # 免认证路径（逗号分隔）
    # 注意：全局路径已统一加 /api/v1 前缀（P0 改造），白名单必须同步
    # /api/v1/public/** 为报告分享链接的免登录访问入口，缺失会导致外部拿不到分享报告
    permit-paths: ${SECURITY_PERMIT_PATHS:/api/v1/auth/login,/api/v1/auth/register,/actuator/health,/api/v1/webhook/test-tasks/trigger,/api/v1/webhook/ci/**,/api/v1/public/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html}
    # 密码最小长度（注册 / 改密 / 管理员建号共用）
    min-password-length: ${SECURITY_MIN_PASSWORD_LENGTH:6}
  bootstrap:
    # 首次启动（库中无用户）时自动创建的默认管理员；生产请改密或关闭
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:admin@123}
  executor:
    # 执行机心跳超时（秒），超时视为离线，从资源池剔除
    heartbeat-timeout: ${EXECUTOR_HEARTBEAT_TIMEOUT:60}
    # 扫描心跳超时节点的间隔（毫秒）
    cleanup-interval-ms: ${EXECUTOR_CLEANUP_INTERVAL_MS:30000}
    # 执行机心跳在 Redis 中的 key 前缀
    redis-key-prefix: ${EXECUTOR_REDIS_KEY_PREFIX:apiweb:executor:heartbeat:}
    # 注册时未声明能力时的默认能力
    default-capabilities: ${EXECUTOR_DEFAULT_CAPABILITIES:api}
  ci:
    # 平台对外访问地址（生成 Jenkinsfile / curl 触发示例时使用），结尾不带 /
    public-base-url: ${CI_PUBLIC_BASE_URL:http://localhost:8080}
    # 同一流水线的最小触发间隔（秒），防止 CI 重复触发；0=不限制
    trigger-min-interval-seconds: ${CI_TRIGGER_MIN_INTERVAL_SECONDS:5}
    # 执行记录列表返回条数上限
    list-max-limit: ${CI_LIST_MAX_LIMIT:100}
    jenkins:
      # HTTP 连接 / 读取超时（毫秒）
      connect-timeout-ms: ${CI_JENKINS_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${CI_JENKINS_READ_TIMEOUT_MS:15000}
      # 触发后解析"队列项 → 构建号"的轮询间隔与超时
      queue-poll-interval-ms: ${CI_JENKINS_QUEUE_POLL_INTERVAL_MS:2000}
      queue-poll-timeout-ms: ${CI_JENKINS_QUEUE_POLL_TIMEOUT_MS:60000}
      # 轮询构建状态的间隔与最大时长
      build-poll-interval-ms: ${CI_JENKINS_BUILD_POLL_INTERVAL_MS:5000}
      build-poll-timeout-minutes: ${CI_JENKINS_BUILD_POLL_TIMEOUT_MINUTES:120}
      # 回写控制台日志的最大字符数（超出截断）
      console-max-chars: ${CI_JENKINS_CONSOLE_MAX_CHARS:20000}
  recycle-bin:
    # 回收站自动清理 cron（Quartz 风格：秒 分 时 日 月 周）
    clean-cron: ${RECYCLE_BIN_CLEAN_CRON:0 0 3 * * ?}
  engine:
    # 执行引擎默认参数（各步骤可在用例中覆盖）
    wait-default-ms: ${ENGINE_WAIT_DEFAULT_MS:1000}
    wait-dynamic-interval-ms: ${ENGINE_WAIT_DYNAMIC_INTERVAL_MS:500}
    wait-dynamic-timeout-ms: ${ENGINE_WAIT_DYNAMIC_TIMEOUT_MS:30000}
    while-max-timeout-ms: ${ENGINE_WHILE_MAX_TIMEOUT_MS:60000}
    while-max-iterations: ${ENGINE_WHILE_MAX_ITERATIONS:1000}
    perf-poll-interval-ms: ${ENGINE_PERF_POLL_INTERVAL_MS:500}
    perf-max-duration-hours: ${ENGINE_PERF_MAX_DURATION_HOURS:2}
    list-max-limit: ${ENGINE_LIST_MAX_LIMIT:100}
    default-parallel-pool-size: ${ENGINE_DEFAULT_PARALLEL_POOL_SIZE:5}
    max-parallel-pool-size: ${ENGINE_MAX_PARALLEL_POOL_SIZE:200}
    executor-queue-capacity: ${ENGINE_EXECUTOR_QUEUE_CAPACITY:1024}
    parallel-wait-timeout-seconds: ${ENGINE_PARALLEL_WAIT_TIMEOUT_SECONDS:60}
    ui:
      # 元素等待超时默认值 / 下限、wait 动作默认时长（毫秒）
      element-timeout-ms: ${UI_ELEMENT_TIMEOUT_MS:5000}
      wait-default-ms: ${UI_WAIT_DEFAULT_MS:1000}
      min-element-timeout-ms: ${UI_MIN_ELEMENT_TIMEOUT_MS:1000}
      # 浏览器运行参数
      headless: ${UI_HEADLESS:true}
      window-size: ${UI_WINDOW_SIZE:1920,1080}
      page-load-timeout-seconds: ${UI_PAGE_LOAD_TIMEOUT_SECONDS:30}
      implicit-wait-seconds: ${UI_IMPLICIT_WAIT_SECONDS:3}
      # 浏览器驱动路径（留空则按 环境变量 > 系统属性 > 自动解析）
      driver-path: ${UI_DRIVER_PATH:}
  oss:
    # 请求/响应体超过该大小（字节）时转存对象存储
    large-body-threshold: ${OSS_LARGE_BODY_THRESHOLD:1048576}
    # MinIO 不可用时的本地降级目录（留空则落到 ${java.io.tmpdir}/apiweb-oss）
    local-root: ${OSS_LOCAL_ROOT:}

logging:
  level:
    com.apiweb: info
    org.quartz: warn

# 可观测性：Actuator 端点（health 公开，其余纳入认证由 AuthInterceptor 保护）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# API 文档：springdoc-openapi
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.apiweb.controller
