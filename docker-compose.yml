version: "3.8"

# Api-Web 自动化测试平台 - 中间件一键拉起
# 用法：docker compose up -d
# 包含：MySQL 8.0 / Redis 7 / RabbitMQ 3.12（含管理界面）/ MinIO（对象存储）

services:
  mysql:
    image: mysql:8.0
    container_name: apiweb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: api_web
      MYSQL_USER: apiweb
      MYSQL_PASSWORD: apiweb123
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建表脚本
      - ./server/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uapiweb", "-papiweb123" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: apiweb-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: apiweb-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: apiweb
      RABBITMQ_DEFAULT_PASS: apiweb123
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # 管理界面 http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: apiweb-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: apiweb
      MINIO_ROOT_PASSWORD: apiweb123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # 控制台 http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
